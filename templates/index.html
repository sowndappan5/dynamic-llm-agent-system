<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaptBot - Self-Extending AI Chatbot</title>
    <!-- Premium Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <style>
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --primary-accent: #2563eb;
            --primary-hover: #1d4ed8;
            --text-color: #111827;
            --text-muted: #6b7280;
            --user-bubble: #e0e7ff;
            --user-text: #1e3a8a;
            --bot-bubble: #f3f4f6;
            --bot-text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .app-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            background: var(--card-bg);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }

        .header-info h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .header-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #ffffff;
        }

        .chat-body::-webkit-scrollbar {
            width: 6px;
        }
        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-body::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .message.user {
            background: var(--user-bubble);
            color: var(--user-text);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: var(--bot-bubble);
            color: var(--bot-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .path-badge {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .path-badge.build { background: #fdf2f8; color: #db2777; border: 1px solid #fbcfe8; }
        .path-badge.chat { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .path-badge.general { background: #e5e7eb; color: #4b5563; border: 1px solid #d1d5db; }

        .typing-indicator {
            align-self: flex-start;
            background: var(--bot-bubble);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
            display: none;
            gap: 4px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .chat-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .input-form {
            display: flex;
            gap: 12px;
            position: relative;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            padding-right: 50px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--primary-accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .submit-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary-accent);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .submit-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        .message strong {
            color: var(--text-color);
            font-weight: 600;
        }

        .message em {
            color: var(--text-muted);
            font-style: italic;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            outline: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }
    </style>
</head>
<body>
        
    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <div class="header-title">
                <div class="logo-icon">A</div>
                <div class="header-info">
                    <h1>AdaptBot</h1>
                    <p>Self-Extending Agentic Engine (FastAPI)</p>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <main class="chat-body" id="chat-body">
            <div class="message bot">
                <span class="path-badge general">system</span>
                <div>Hello! I am AdaptBot. You can ask me general questions, use my tools, or direct me to build, modify, or delete tools for you dynamically. What would you like to do?</div>
            </div>
        </main>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Chat Footer -->
        <footer class="chat-footer">
            <form class="input-form" id="chat-form">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Type your query or ask to build a tool..." autocomplete="off" required>
                    <button type="submit" class="submit-btn" aria-label="Send Message">
                        <svg viewBox="0 0 24 24">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </form>
        </footer>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatBody = document.getElementById('chat-body');
        const typingIndicator = document.getElementById('typing-indicator');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = chatInput.value.trim();
            if (!messageText) return;

            // 1. Add User Message to Chat UI
            appendMessage(messageText, 'user');
            chatInput.value = '';

            // 2. Show Typing Indicator
            showTyping(true);

            try {
                // 3. Post to backend
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: messageText })
                });

                if (!response.ok) {
                    throw new Error('Network error received.');
                }

                const data = await response.json();
                
                // 4. Add Bot Response to UI
                if (data.need_tool) {
                    appendToolPrompt(data.response, data.original_question);
                } else {
                    appendMessage(data.response, 'bot', data.path, data.tool_build);
                }

            } catch (err) {
                appendMessage('Oops, I encountered a connection issue: ' + err.message, 'bot', 'error');
            } finally {
                showTyping(false);
            }
        });

        function appendMessage(text, sender, path = null, isBuild = false) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            if (sender === 'bot') {
                let badgeClass = 'general';
                if (path === 'tool_generator' || isBuild) badgeClass = 'build';
                else if (path && path !== 'general') badgeClass = 'chat';
                
                const badgeText = path || 'agent';

                messageDiv.innerHTML = `
                    <span class="path-badge ${badgeClass}">${badgeText}</span>
                    <div>${text}</div>
                `;
            } else {
                messageDiv.innerText = text;
            }

            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function appendToolPrompt(text, originalQuestion) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'bot');
            
            messageDiv.innerHTML = `
                <span class="path-badge build">system</span>
                <div>
                    <p>${text}</p>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="btn-create-tool">Create Tool</button>
                        <button class="btn btn-secondary" id="btn-cancel-tool">Cancel</button>
                    </div>
                </div>
            `;
            
            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
            
            const btnCreate = messageDiv.querySelector('#btn-create-tool');
            const btnCancel = messageDiv.querySelector('#btn-cancel-tool');
            
            btnCancel.addEventListener('click', () => {
                messageDiv.querySelector('.btn-group').remove();
                appendMessage('Tool creation cancelled.', 'bot', 'general');
            });
            
            btnCreate.addEventListener('click', async () => {
                messageDiv.querySelector('.btn-group').remove();
                
                appendMessage(`Initiating build for tool to resolve: "<em>${originalQuestion}</em>"`, 'bot', 'tool_generator');
                showTyping(true);
                
                try {
                    const buildRes = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: `Build a tool to answer this question: ${originalQuestion}` })
                    });
                    
                    if (!buildRes.ok) {
                        throw new Error('Tool generation failed.');
                    }
                    
                    const buildData = await buildRes.json();
                    appendMessage(buildData.response, 'bot', buildData.path, buildData.tool_build);
                    
                    if (buildData.tool_build) {
                        appendMessage(`Running original query: "<em>${originalQuestion}</em>"...`, 'bot', 'general');
                        showTyping(true);
                        
                        const queryRes = await fetch('/chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ message: originalQuestion })
                        });
                        
                        if (!queryRes.ok) {
                            throw new Error('Failed to run query after building tool.');
                        }
                        
                        const queryData = await queryRes.json();
                        appendMessage(queryData.response, 'bot', queryData.path, queryData.tool_build);
                    }
                } catch (err) {
                    appendMessage('Error creating or executing tool: ' + err.message, 'bot', 'error');
                } finally {
                    showTyping(false);
                }
            });
        }

        function showTyping(show) {
            if (show) {
                typingIndicator.style.display = 'flex';
                chatBody.appendChild(typingIndicator);
                chatBody.scrollTop = chatBody.scrollHeight;
            } else {
                typingIndicator.style.display = 'none';
            }
        }
    </script>
</body>
</html>
